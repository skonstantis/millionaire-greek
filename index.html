<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Millionaire Host</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section id="setupScreen" class="screen setup-screen">
      <div class="logo">€</div>
      <h1>Millionaire</h1>

      <div class="player-field">
        <input id="playerName" type="text" maxlength="24" placeholder="Όνομα παίκτη (προαιρετικό)" autocomplete="off">
      </div>

      <div class="category-picker">
        <p class="category-hint">Διάλεξε κατηγορίες (ή καμία για όλες)</p>
        <div id="categoryChips" class="category-chips"></div>
      </div>

      <button id="startBtn" class="primary-btn start-btn" type="button">Έναρξη</button>

      <div class="setup-tools">
        <button id="addQuestionBtn" class="ghost-btn" type="button">Προσθήκη ερωτήσεων</button>
        <button id="customSessionBtn" class="ghost-btn" type="button">Δική σου παρτίδα</button>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <section class="host-panel">
        <header class="host-header">
          <strong id="questionCounter">—</strong>
          <strong id="amountDisplay">—</strong>
          <button id="adminToggle" class="host-answer-toggle icon-btn admin-toggle" type="button" aria-label="Admin mode" title="Admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.6 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88L2.72 14.5a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96a7 7 0 0 0 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg></button>
        </header>

        <div id="preQuestionStage" class="pre-question-stage hidden">
          <div class="logo small">€</div>
          <h2 id="preQuestionTitle">Έτοιμοι;</h2>
          <p id="playerBadge" class="player-badge hidden">—</p>
          <section id="triviaCard" class="trivia-card hidden" aria-label="Trivia για τον παρουσιαστή">
            <span class="trivia-kicker">TRIVIA · HOST NOTE</span>
            <p id="triviaText">—</p>
            <small id="triviaSource">—</small>
          </section>
          <div class="stage-actions">
            <button id="showQuestionBtn" class="primary-btn" type="button">Ερώτηση</button>
            <button id="stopGameBtn" class="cash-btn hidden" type="button">Τέλος</button>
          </div>
        </div>

        <div id="questionStage" class="question-stage hidden">
          <div class="question-shell">
            <span class="diamond left"></span>
            <div class="question-card">
              <h3 id="questionText">—</h3>
            </div>
            <span class="diamond right"></span>
          </div>

          <div id="answersGrid" class="answers-grid"></div>

          <div class="host-row">
            <button id="revealAnswerBtn" class="host-answer-toggle icon-btn" type="button" aria-label="Σωστή απάντηση" title="Σωστή απάντηση"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.6-6 9.6-6 9.6 6 9.6 6-3.6 6-9.6 6-9.6-6-9.6-6Zm9.6 3.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"/></svg></button>
            <button id="adminSkipBtn" class="admin-action hidden" type="button">Πήδα ερώτηση</button>
            <button id="adminSwapBtn" class="admin-action hidden" type="button">Αλλαγή (δωρεάν)</button>
          </div>

          <section id="lifelines" class="lifelines" aria-label="Βοήθειες">
            <button id="fiftyBtn" class="lifeline-btn" type="button" data-lifeline="fifty" aria-label="50:50" title="50:50">
              <span class="fifty-icon" aria-hidden="true">50:50</span>
            </button>
            <button id="phoneBtn" class="lifeline-btn" type="button" data-lifeline="phone" aria-label="Τηλέφωνο" title="Τηλέφωνο">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.8 9.3 7c.4.6.3 1.4-.2 1.9l-1.5 1.5a14.2 14.2 0 0 0 6 6l1.5-1.5c.5-.5 1.3-.6 1.9-.2l4.2 2.7c.6.4.9 1.1.6 1.8l-.7 1.8c-.3.7-.9 1.1-1.6 1.1C9.8 21.8 2.2 14.2 1.9 4.5c0-.7.4-1.3 1.1-1.6l1.8-.7c.7-.3 1.4 0 1.8.6Z"/></svg>
            </button>
            <button id="audienceBtn" class="lifeline-btn" type="button" data-lifeline="audience" aria-label="Κοινό" title="Κοινό">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6.5-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 20.5c0-4 3.1-7 7-7s7 3 7 7v.5H2v-.5Zm14.4.5c.1-.8 0-1.7-.2-2.5-.3-1.3-.9-2.5-1.8-3.5.4-.1.7-.1 1.1-.1 3.6 0 6.5 2.5 6.5 6.1h-5.6Z"/></svg>
            </button>
            <button id="changeBtn" class="lifeline-btn" type="button" data-lifeline="change" aria-label="Αλλαγή" title="Αλλαγή">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.1 7H17l-2.4-2.4L16 3.2 20.8 8 16 12.8l-1.4-1.4L17 9H7.1A4.1 4.1 0 0 0 3 13.1V15H1v-1.9A6.1 6.1 0 0 1 7.1 7Zm9.8 10H7l2.4 2.4L8 20.8 3.2 16 8 11.2l1.4 1.4L7 15h9.9a4.1 4.1 0 0 0 4.1-4.1V9h2v1.9a6.1 6.1 0 0 1-6.1 6.1Z"/></svg>
            </button>
          </section>

          <div id="continueWrap" class="continue-wrap hidden">
            <button id="continueBtn" class="primary-btn continue-btn" type="button">Συνέχεια</button>
          </div>
        </div>
      </section>

      <aside class="money-ladder">
        <ol id="ladder"></ol>
      </aside>
    </section>

    <section id="endScreen" class="screen end-screen hidden">
      <div class="logo">€</div>
      <h1 id="endTitle">—</h1>
      <div id="statsGrid" class="stats-grid"></div>
      <div class="end-actions">
        <button id="newGameBtn" class="primary-btn" type="button">Νέο</button>
      </div>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">—</h2>
        <button id="modalCloseBtn" class="modal-close" type="button">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <audio id="soundIntro" src="assets/sounds/intro.mp3" preload="auto"></audio>
  <audio id="soundPlay" src="assets/sounds/play.mp3" preload="auto"></audio>
  <audio id="soundSuspense" src="assets/sounds/suspense.mp3" preload="auto" loop></audio>
  <audio id="soundLock" src="assets/sounds/lock.mp3" preload="auto"></audio>
  <audio id="soundRight" src="assets/sounds/right.mp3" preload="auto"></audio>
  <audio id="soundWrong" src="assets/sounds/wrong.mp3" preload="auto"></audio>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
